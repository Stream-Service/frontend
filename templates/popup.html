<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <script src="/static/js/config.js"></script>

  <script src="/static/js/base.js" defer></script>
  <script src="/static/js/popup.js" defer></script>

  <link rel="stylesheet" href="/static/css/popup.css">
  <link rel="stylesheet" href="/static/css/contrast-fix.css">
</head>
<body>
  <my-topbar></my-topbar>
  <my-navbar></my-navbar>
  <bottom-navbar></bottom-navbar>

  <div id="uploadOverlay" class="overlay">
    <div class="uploadPopup">
      <div class="uploadLeft">
        <h2>Preview Area</h2>
        <p>Your image preview will appear here.</p>
      </div>
      <div class="uploadRight">
        <form id="uploadForm">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" placeholder="Enter title">
          <label for="description">Description</label>
          <textarea id="description" name="description" placeholder="Enter description"></textarea>
          <label for="image">Select Image</label>
          <input type="file" id="image" name="image" accept="image/*">
          <button type="submit">Post</button>
        </form>
      </div>
    </div>
  </div>

  <div id="uploadOverlay2" class="overlay">
    <div class="uploadPopup">
      <span class="close-upload" id="closeUpload2">&times;</span>
      <div class="uploadLeft">
        <h2>Preview Area</h2>
        <p>Your video preview will appear here.</p>
      </div>
      <div class="uploadRight">
        <form id="uploadForm2">
          <label for="videoTitle">Title</label>
          <input type="text" id="videoTitle" name="title" placeholder="Enter title">
          <label for="videoDescription">Description</label>
          <textarea id="videoDescription" name="description" placeholder="Enter description"></textarea>
          <label for="videoInput">Select Video</label>
          <input type="file" id="videoInput" name="video" accept="video/*">
          <button type="submit">Upload Video</button>
        </form>
        <p id="status"></p>
      </div>
    </div>
  </div>

  <!-- Intro section -->
  <div class="crush_intro">
    <div class="crush_intro-left">
      <img src="" id='imgg' alt="crush_Profile Picture" class="crush_popup-profile-pic" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27%23d80921%27%3E%3Cpath d=%27M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z%27/%3E%3C/svg%3E'">
      <button class="crush_subscribe-btn">Subscribe</button>
    </div>

    <div class="crush_intro-right">
  <h3>About</h3>


  <p id="disp"></p>
</div>


  </div>
  <div id="videoModal" class="modal2">
    <div class="modal-content">
      <div class="video-section">
        <video id="videoPlayer" controls></video>
        <div class="video-actions">
          <button id="Subscribe" class="action-btn">
            👍 <span>Subscibe</span> <span id="likeCount">0</span>
          </button>
          <button id="likeBtn" class="action-btn">
            👍 <span>Like</span> <span id="likeCount">0</span>
          </button>
          <button id="dislikeBtn" class="action-btn">
            👎 <span>Dislike</span> <span id="dislikeCount">0</span>
          </button>
        </div>
      </div>
      <div class="comments-section">
        <h3>Comments</h3>
        <div id="addCommentBox" style="margin-bottom:15px;">
          <textarea id="newComment" placeholder="Write a comment..." rows="3" style="width:100%; padding:8px;"></textarea>
          <button id="submitComment" class="action-btn" style="margin-top:8px;">💬 Add Comment</button>
        </div>
        <div id="commentsContainer"></div>
      </div>
      <span class="close-btn" id="closePopup">&times;</span>
    </div>
  </div>

  <!-- Navigation links -->
  <div class="crush_nav-links">
    <a id="crush_videoLink">Video</a>
    <a id="crush_postLink" class="active">Post</a>
    <a id="crush_aboutLink">About</a>
  </div>

  <!-- Content section -->
  <div class="crush_profile_content">
  <div id="crush_videoSection" class="video active">
    <h3>Videos</h3>
    <div id="crush_videoGrid"></div>
  </div>

  <div id="crush_postSection" class="post">
    <h3>Posts</h3>
    <div id="crush_postsGrid"></div>
  </div>

  <div id="crush_aboutSection" class="about">

  </div>
</div>





</body>
</html>
