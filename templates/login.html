<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | SocialApp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/login.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="/static/js/config.js"></script>
  <link rel="stylesheet" href="/static/css/contrast-fix.css">
</head>
<body>

  <div id="errorPopup" class="popup-overlay">
    <div class="popup-content">
      <div class="popup-icon error">
        <i class="fas fa-exclamation-circle"></i>
      </div>
      <h3>Login Failed</h3>
      <p id="errorMessage">Invalid credentials. Please try again.</p>
      <button class="popup-btn" id="closeErrorPopup">Try Again</button>
    </div>
  </div>

  <div class="login-box">
    <h2>Welcome Back</h2>
    <div class="input-group">
      <input type="email" id="login_username" placeholder="Email" required>
    </div>
    <div class="input-group">
      <input type="password" id="login_pass" placeholder="Password" required>
    </div>
    <div class="forgot-password">
      <a href="./forgot_password.html">Forgot Password?</a>
    </div>
    <div class="input-group">
      <button id="login_button">Login</button>
    </div>
    <p>New here? <a href="./register.html">Create an account</a></p>
    <div id="status"></div>
  </div>

  <script src="/static/js/base.js"></script>
  <script src="/static/js/login.js"></script>
</body>
</html>
