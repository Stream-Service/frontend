<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password | SocialApp</title>
  <script src="/static/js/config.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/forgot.css">
  <link rel="stylesheet" href="/static/css/contrast-fix.css">
</head>
<body>
  <div class="forgot-box">
    <h2>Reset Your Password</h2>
    
    <form id="forgotPasswordForm">
        <div id="emailSection">
            <p>Enter your registered email to receive an OTP.</p>
            <div class="input-group">
                <input type="email" id="email" placeholder="Email" name="email" required>
            </div>
            <div class="input-group">
                <button type="button" id="sendOtpBtn">Send OTP</button>
            </div>
        </div>

        <div id="otpSection" style="display: none;">
            <p>An OTP has been sent to your email.</p>
            <div class="input-group">
                <input type="text" id="otp" placeholder="Enter OTP" name="otp">
            </div>
            <div class="input-group">
                <button type="button" id="verifyOtpBtn">Verify OTP</button>
            </div>
        </div>

        <div id="resetSection" style="display: none;">
            <p>Enter your new password.</p>
            <div class="input-group">
                <input type="password" id="newPassword" placeholder="New Password" name="newPassword">
            </div>
            <div class="input-group">
                <input type="password" id="confirmPassword" placeholder="Confirm Password" name="confirmPassword">
            </div>
            <div class="input-group">
                <button type="button" id="resetPasswordBtn">Reset Password</button>
            </div>
        </div>
    </form>
    
    <div id="messageDisplay"></div>
</div>

  <script src="/static/js/forgot_password.js"></script>
</body>
</html>
