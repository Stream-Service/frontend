<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="/static/js/base.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/feed.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="/static/js/config.js"></script>
    <style>
        #Your_videos {
            margin-top: 90px;
            margin-left: 90px;
            padding: 25px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 28px;
            max-width: 1600px;
        }

        .video-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            overflow: visible;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .video-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 35px rgba(216, 9, 33, 0.2);
        }

        .video-card .thumbnail_section {
            width: 100%;
            height: 220px;
            overflow: hidden;
        }

        .video-card .thumbnail_section img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .video-card:hover .thumbnail_section img {
            transform: scale(1.05);
        }

        .video-card .description_section {
            padding: 18px;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
        }

        .video-card .left_description_section {
            flex: 1;
            min-width: 0;
        }

        .video-card .right_description_section {
            flex: 1;
            min-width: 0;
            text-align: right;
        }

        .video-card .video-title {
            display: block;
            font-size: 1.1em;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .video-card .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .video-card .user-pic {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #d80921;
            cursor: pointer;
        }

        .video-card .username {
            font-weight: 600;
            font-size: 0.95em;
            color: #1a1a1a;
        }

        .video-card span {
            font-size: 0.85em;
            color: #666;
        }

        .video-card .menu {
            position: absolute;
            top: 10px;
            right: 10px;
        }

        .video-card .menu-btn {
            background: rgba(0,0,0,0.5);
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            transition: background 0.3s ease;
        }

        .video-card .menu-btn:hover {
            background: #d80921;
        }

        .video-card .dropdown {
            position: absolute;
            right: 0;
            top: 100%;
            background: white;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 6px 0;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            z-index: 100;
            min-width: 140px;
        }

        .video-card .dropdown.hidden {
            display: none;
        }

        .video-card .delete-btn {
            background: none;
            border: none;
            color: #d80921;
            cursor: pointer;
            padding: 12px 18px;
            font-size: 0.9em;
            width: 100%;
            text-align: left;
            transition: background 0.3s ease;
        }

        .video-card .delete-btn:hover {
            background: #ffe5e5;
        }

        @media (max-width: 768px) {
            #Your_videos {
                margin-left: 0;
                padding: 15px;
                grid-template-columns: 1fr;
            }
        }

        #Your_videos:empty::after {
            content: 'No videos yet. Upload your first video!';
            display: block;
            grid-column: 1 / -1;
            text-align: center;
            color: #666;
            font-size: 1.2em;
            padding: 60px;
        }
    </style>


  <link rel="stylesheet" href="/static/css/contrast-fix.css">
</head>
<body>
    
    <my-topbar></my-topbar>
    <my-navbar></my-navbar>
    <bottom-navbar></bottom-navbar>
    <div id="Your_videos">

    </div>

    <div id="videoModal" class="modal2">
    <div class="modal-content">
      <div class="video-section">
        <video id="videoPlayer" controls></video>
        <div class="video-actions">
          <button id="Subscribe" class="action-btn">
            👍 <span>Subscibe</span> <span id="likeCount">0</span>
          </button>
          <button id="likeBtn" class="action-btn">
            👍 <span>Like</span> <span id="likeCount">0</span>
          </button>
          <button id="dislikeBtn" class="action-btn">
            👎 <span>Dislike</span> <span id="dislikeCount">0</span>
          </button>
        </div>
      </div>
      <div class="comments-section">
        <h3>Comments</h3>
        <div id="addCommentBox" style="margin-bottom:15px;">
          <textarea id="newComment" placeholder="Write a comment..." rows="3" style="width:100%; padding:8px;"></textarea>
          <button id="submitComment" class="action-btn" style="margin-top:8px;">💬 Add Comment</button>
        </div>
        <div id="commentsContainer"></div>
      </div>
      <span class="close-btn" id="closePopup">&times;</span>
    </div>
  </div>

  <!-- Profile Modal -->
  <div id="profileModal" class="profile-modal">
    <div class="profile-modal-content">
      <span class="profile-modal-close" id="closeProfileModal">&times;</span>

      <div class="profile-intro">
        <div class="profile-intro-left">
          <img src="" id="profileModalPic" alt="Profile Picture" class="profile-modal-pic">
          <button class="profile-subscribe-btn" id="profileSubscribeBtn">Subscribe</button>
        </div>
        <div class="profile-intro-right">
          <h3>About</h3>
          <p id="profileModalDesc"></p>
        </div>
      </div>

      <div class="profile-nav-links">
        <a id="profileVideoLink" class="profile-nav-active">Video</a>
        <a id="profilePostLink">Post</a>
        <a id="profileAboutLink">About</a>
      </div>

      <div class="profile-content">
        <div id="profileVideoSection" class="profile-section-active">
          <h3>Videos</h3>
          <div id="profileVideoGrid"></div>
        </div>
        <div id="profilePostSection" class="profile-section">
          <h3>Posts</h3>
          <div id="profilePostsGrid"></div>
        </div>
        <div id="profileAboutSection" class="profile-section">
        </div>
      </div>
    </div>
  </div>
  <div id="uploadOverlay" class="overlay">
      <div class="uploadPopup">
        <!-- Left side -->
        <div class="uploadLeft">
          <h2>Preview Area</h2>
          <p>Your image preview will appear here.</p>
        </div>

        <!-- Right side -->
        <div class="uploadRight">
          <form id="uploadForm">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" placeholder="Enter title">

            <label for="description">Description</label>
            <textarea id="description" name="description" placeholder="Enter description"></textarea>

            <label for="image">Select Image</label>
            <input type="file" id="image" name="image" accept="image/*">

            <button type="submit">Post</button>
          </form>
        </div>
      </div>
    </div>


    <div id="uploadOverlay2" class="overlay">
      <div class="uploadPopup">
        <!-- Left side -->
        <div class="uploadLeft">
          <h2>Preview Area</h2>
          <p>Your image preview will appear here.</p>
        </div>

        <!-- Right side -->
        <div class="uploadRight">
          <form id="uploadForm2">
            <label for="title">Title</label>
            <input type="text" id="videoTitle" name="title" placeholder="Enter title">

            <label for="description">Description</label>
            <textarea id="videoDescription" name="description" placeholder="Enter description"></textarea>

            <label for="video">Select Image</label>
            <input type="file" id="videoInput" name="video" accept="videos/*">

            <button type="submit">Upload Video</button>
          </form>
          <p id="status"></p>
        </div>
      </div>
    </div>
    <script src="/static/js/video.js"></script>
</body>
</html>
