<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="/static/js/config.js"></script>
    <link rel="stylesheet" href="/static/css/posts.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>My Posts</title>
    <style>
        .my-posts-header {
            margin-top: 90px;
            margin-left: 90px;
            padding: 30px 40px;
            max-width: 1400px;
            margin-right: auto;
        }

        .my-posts-header h1 {
            color: var(--text-dark, #1a1a1a);
            font-size: 2em;
            margin: 0 0 10px;
        }

        .my-posts-header p {
            color: var(--text-muted, #666);
            margin: 0;
        }

        @media (max-width: 768px) {
            .my-posts-header {
                margin-left: 0;
                padding: 20px;
            }
        }
    </style>
  <link rel="stylesheet" href="/static/css/contrast-fix.css">
</head>
<body>
    <my-topbar></my-topbar>
    <my-navbar></my-navbar>
    <bottom-navbar></bottom-navbar>

    <div id="uploadOverlay" class="overlay">
      <div class="uploadPopup">
        <div class="uploadLeft">
          <h2>Preview Area</h2>
          <p>Your image preview will appear here.</p>
        </div>
        <div class="uploadRight">
          <form id="uploadForm">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" placeholder="Enter title">
            <label for="description">Description</label>
            <textarea id="description" name="description" placeholder="Enter description"></textarea>
            <label for="image">Select Image</label>
            <input type="file" id="image" name="image" accept="image/*">
            <button type="submit">Post</button>
          </form>
        </div>
      </div>
    </div>

    <div id="uploadOverlay2" class="overlay">
      <div class="uploadPopup">
        <span class="close-upload" id="closeUpload2">&times;</span>
        <div class="uploadLeft">
          <h2>Preview Area</h2>
          <p>Your video preview will appear here.</p>
        </div>
        <div class="uploadRight">
          <form id="uploadForm2">
            <label for="videoTitle">Title</label>
            <input type="text" id="videoTitle" name="title" placeholder="Enter title">
            <label for="videoDescription">Description</label>
            <textarea id="videoDescription" name="description" placeholder="Enter description"></textarea>
            <label for="videoInput">Select Video</label>
            <input type="file" id="videoInput" name="video" accept="video/*">
            <button type="submit">Upload Video</button>
          </form>
          <p id="status"></p>
        </div>
      </div>
    </div>

    <div class="my-posts-header">
        <h1><i class="fas fa-user-circle"></i> My Posts</h1>
        <p>All your posts in one place</p>
    </div>

    <div id="posts_grid"></div>
    <script src="/static/js/base.js"></script>
    <script src="/static/js/new_post.js"></script>
</body>
</html>
